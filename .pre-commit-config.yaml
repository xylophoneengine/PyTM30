# Merge commits fire pre-merge-commit, not pre-commit; without the second
# hook type a `git merge` lands unchecked (how an unformatted remediation
# branch reached main). `pre-commit install` reads this list, and the CMake
# configure step runs that install automatically.
default_install_hook_types: [pre-commit, pre-merge-commit]

repos:
  # Runs before clang-format: transliterating a comment can push it past the
  # column limit, and clang-format should get the final say on the result.
  - repo: local
    hooks:
      - id: fix-unicode
        name: transliterate non-ASCII to ASCII
        entry: python3 tools/fix_unicode.py
        language: system
        pass_filenames: true
        # Hand-authored text only. data/*.csv, tests/fixtures/* and generated
        # benchmark reports are machine-written and excluded in the script too.
        # Kept in lockstep with INCLUDE_SUFFIXES / INCLUDE_NAMES in
        # tools/fix_unicode.py; tools/test_fix_unicode.py asserts they agree.
        files: \.(cpp|cc|cxx|hpp|h|py|pyi|md|txt|yaml|yml|cmake|toml|cff|sh|ps1|rst|in)$|(^|/)(CMakeLists\.txt|Makefile|Dockerfile|\.clang-format|\.gitattributes|\.gitignore)$
        exclude: ^(data/|tests/fixtures/|benchmarks/out_|benchmarks/.*report.*\.txt$|LICENSE$)

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]
